name: CI - Build and Test Angular Application
description: Build, test, and check code format for an Angular application on push or pull request to prod or preprod branches.

on:
  push:
    branches: ["prod"]
  pull_request:
    branches: ["prod", "preprod"]

jobs:
  check_code_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check code format
        run: npx prettier --check "src/**/*.ts" "src/**/*.html" "src/**/*.css"

  build_and_test:
    runs-on: ubuntu-latest
    needs: check_code_format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Run unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: dist/<ton-nom-de-projet>/
