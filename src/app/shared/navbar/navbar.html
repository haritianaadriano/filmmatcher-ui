<nav
  class="w-full fixed overflow-hidden backdrop-blur-sm z-50"
  style="background-color: rgba(0, 0, 0, 0.4)"
>
  <div class="flex items-center justify-between p-4 w-full">
    <!-- Logo -->
    <a href="/" class="flex flex-col items-center leading-none">
      <span
        class="font-anton font-semibold text-3xl sm:text-4xl md:text-5xl text-white"
        >Instant</span
      >
      <span
        class="font-mistrully font-semibold text-2xl sm:text-3xl md:text-4xl text-cyan-400 -mt-1 md:-mt-2"
        >Crush</span
      >
    </a>

    <!-- Searchbar (always visible, centered) -->
    <div class="flex-1 mx-4 flex justify-center">
      <div class="relative w-full max-w-md">
        <div
          class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
        >
          <svg
            class="w-5 h-5 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1110.5 3a7.5 7.5 0 016.15 13.65z"
            />
          </svg>
        </div>
        <input
          [(ngModel)]="searchValue"
          type="text"
          placeholder="Search movie..."
          class="w-full pl-10 pr-4 py-2 bg-neutral-900 rounded-full border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-500"
        />
        <button
          (click)="onSearch()"
          class="absolute right-1 top-1/2 transform -translate-y-1/2 px-4 py-1 bg-blue-500 text-white rounded-full hover:bg-blue-600 transition"
        >
          Search
        </button>
      </div>
    </div>

    <!-- Menu desktop -->
    <div class="hidden md:flex md:items-center md:space-x-4">
      <a href="/movies" class="text-white hover:text-blue-500 font-semibold"
        >Movies</a
      >
      <a href="/contact" class="text-white hover:text-blue-500 font-semibold"
        >Contact</a
      >
      <a href="/about" class="text-white hover:text-blue-500 font-semibold"
        >About</a
      >

      <span class="text-white">|</span>

      <button
        onclick="window.location.href='/auth/login'"
        class="px-4 py-2 text-white rounded hover:bg-white hover:text-gray-900 transition"
      >
        Login
      </button>
      <button
        class="px-4 py-2 bg-blue-500 text-white hover:bg-blue-600 transition rounded-full"
      >
        Signup Free
      </button>
    </div>

    <!-- Burger button mobile -->
    <button
      class="md:hidden text-white focus:outline-none ml-2"
      aria-label="Toggle menu"
      (click)="toggleMenu()"
    >
      <svg
        class="w-8 h-8"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Menu mobile -->
  @if (menuOpen) {
    <div class="flex flex-col space-y-2 bg-gray-800 p-4 md:hidden">
      <a href="/movies" class="text-white hover:text-blue-500 font-semibold"
        >Movies</a
      >
      <a href="/contact" class="text-white hover:text-blue-500 font-semibold"
        >Contact</a
      >
      <a href="/about" class="text-white hover:text-blue-500 font-semibold"
        >About</a
      >

      <!-- Login / Signup mobile -->
      <div class="flex items-center space-x-2 mt-2">
        <button
          onclick="window.location.href='/auth/login'"
          class="px-4 py-2 text-white rounded hover:bg-white hover:text-gray-900 transition"
        >
          Login
        </button>
        <button
          class="px-4 py-2 bg-blue-500 text-white hover:bg-blue-600 transition rounded-full"
        >
          Signup Free
        </button>
      </div>
    </div>
  }
</nav>
