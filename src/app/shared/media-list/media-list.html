<!-- Tab Navigation -->
<div class="mb-8">
  <div class="flex gap-4 border-b-2 border-gray-300">
    <!-- Movies tab button -->
    <button
      (click)="switchTab('movies')"
      [ngClass]="{
        'border-b-2 border-gray-900 text-gray-900': activeTab === 'movies',
        'text-gray-500 hover:text-gray-800': activeTab !== 'movies',
      }"
      class="px-6 py-3 font-semibold transition-all duration-300 text-sm md:text-base"
    >
      <span class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"
          />
        </svg>
        <span>Movies</span>
        <span class="bg-gray-800 text-white text-xs rounded-full px-2 py-1">
          {{ movies.length }}
        </span>
      </span>
    </button>

    <!-- TV Shows tab button -->
    <button
      (click)="switchTab('shows')"
      [ngClass]="{
        'border-b-2 border-gray-900 text-gray-900': activeTab === 'shows',
        'text-gray-500 hover:text-gray-800': activeTab !== 'shows',
      }"
      class="px-6 py-3 font-semibold transition-all duration-300 text-sm md:text-base"
    >
      <span class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
            clip-rule="evenodd"
          />
        </svg>
        <span>TV Shows</span>
        <span class="bg-gray-800 text-white text-xs rounded-full px-2 py-1">
          {{ shows.length }}
        </span>
      </span>
    </button>
  </div>
</div>

<!-- ───────────── MOVIES TAB ───────────── -->
<div *ngIf="activeTab === 'movies'">
  <!-- Skeleton loader -->
  <div
    *ngIf="isLoadingMovies"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    <div *ngFor="let _ of [1, 2, 3, 4, 5, 6, 7, 8]" class="animate-pulse">
      <div class="bg-gray-300 rounded-xl h-80 mb-4"></div>
      <div class="bg-gray-300 rounded h-4 mb-2"></div>
      <div class="bg-gray-300 rounded h-4 w-3/4"></div>
    </div>
  </div>

  <!-- Loaded content -->
  <div *ngIf="!isLoadingMovies">
    <!-- Empty state -->
    <div
      *ngIf="movies.length === 0"
      class="text-center py-12 text-gray-500 text-lg"
    >
      <svg
        class="w-16 h-16 mx-auto mb-4 text-gray-400"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"
        />
      </svg>
      <p>No movies to display.</p>
    </div>

    <!-- Movies grid -->
    <div
      *ngIf="movies.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    >
      <div
        *ngFor="let movie of movies"
        class="group relative bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 hover:scale-105 h-full flex flex-col border border-gray-200 cursor-pointer"
        tabindex="0"
        (click)="onSelectMovie(movie)"
        (keyup.enter)="onSelectMovie(movie)"
      >
        <!-- Poster -->
        <div class="relative overflow-hidden bg-gray-200 h-64 sm:h-80">
          <img
            [src]="movie.image.url || 'assets/placeholder.png'"
            [alt]="movie.original_title"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
          />
          <div
            class="absolute inset-0 bg-gradient-to-t from-gray-900/20 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"
          ></div>
        </div>

        <!-- Info -->
        <div class="p-4 flex flex-col flex-1">
          <h3
            class="text-lg font-bold text-gray-900 mb-2 line-clamp-2 group-hover:text-gray-700 transition-colors"
          >
            {{ movie.primary_title }}
          </h3>

          <!-- Score badge -->
          <div
            [ngClass]="{
              'bg-red-200 text-red-800': (movie.meta_critic?.score ?? 0) < 5,
              'bg-yellow-200 text-yellow-800':
                (movie.meta_critic?.score ?? 0) >= 5 &&
                (movie.meta_critic?.score ?? 0) < 7,
              'bg-green-200 text-green-800':
                (movie.meta_critic?.score ?? 0) >= 7,
              'bg-gray-200 text-gray-800': !movie.meta_critic?.score,
            }"
            class="inline-flex items-center gap-1 px-3 py-1 text-xs font-bold rounded-full w-max"
          >
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
              <path
                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
              />
            </svg>
            <span>{{ movie.meta_critic?.score?.toFixed(1) ?? "N/A" }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ───────────── TV SHOWS TAB ───────────── -->
<div *ngIf="activeTab === 'shows'">
  <!-- Skeleton loader -->
  <div
    *ngIf="isLoadingShows"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    <div *ngFor="let _ of [1, 2, 3, 4, 5, 6, 7, 8]" class="animate-pulse">
      <div class="bg-gray-300 rounded-xl h-80 mb-4"></div>
      <div class="bg-gray-300 rounded h-4 mb-2"></div>
      <div class="bg-gray-300 rounded h-4 w-3/4"></div>
    </div>
  </div>

  <!-- Loaded content -->
  <div *ngIf="!isLoadingShows">
    <!-- Empty state -->
    <div
      *ngIf="shows.length === 0"
      class="text-center py-12 text-gray-500 text-lg"
    >
      <svg
        class="w-16 h-16 mx-auto mb-4 text-gray-400"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
          clip-rule="evenodd"
        />
      </svg>
      <p>No TV shows to display.</p>
    </div>

    <!-- TV Shows grid -->
    <div
      *ngIf="shows.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    >
      <div
        *ngFor="let show of shows"
        class="group relative bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 hover:scale-105 h-full flex flex-col border border-gray-200 cursor-pointer"
        tabindex="0"
        (click)="onSelectMedia(show)"
        (keyup.enter)="onSelectMedia(show)"
      >
        <!-- Poster -->
        <div class="relative overflow-hidden bg-gray-200 h-64 sm:h-80">
          <img
            [src]="show.poster_path || 'assets/placeholder.png'"
            [alt]="show.name"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
          />
          <div
            class="absolute inset-0 bg-gradient-to-t from-gray-900/20 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"
          ></div>
        </div>

        <!-- Info -->
        <div class="p-4 flex flex-col flex-1">
          <h3
            class="text-lg font-bold text-gray-900 mb-2 line-clamp-2 group-hover:text-gray-700 transition-colors"
          >
            {{ show.name }}
          </h3>

          <!-- Genres -->
          <div class="flex flex-wrap gap-2 mb-3">
            <span
              *ngFor="let genre of show.genres | slice: 0 : 2"
              class="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded border border-gray-300"
            >
              {{ genre }}
            </span>
          </div>

          <!-- Description -->
          <p class="text-gray-600 text-sm line-clamp-3 mb-4 flex-1">
            {{ show.description || "No description available." }}
          </p>

          <!-- Score badge -->
          <div
            [ngClass]="{
              'bg-red-200 text-red-800': (show.meta_critic?.score ?? 0) < 50,
              'bg-yellow-200 text-yellow-800':
                (show.meta_critic?.score ?? 0) >= 50 &&
                (show.meta_critic?.score ?? 0) < 70,
              'bg-green-200 text-green-800':
                (show.meta_critic?.score ?? 0) >= 70,
              'bg-gray-200 text-gray-800': !show.meta_critic?.score,
            }"
            class="inline-flex items-center gap-1 px-3 py-1 text-xs font-bold rounded-full w-max"
          >
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                clip-rule="evenodd"
              />
            </svg>
            <span>{{ show.meta_critic?.score ?? "N/A" }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
