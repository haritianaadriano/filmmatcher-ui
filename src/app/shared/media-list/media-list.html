<!-- Tab Navigation -->
<div class="mb-8">
  <div class="flex gap-4 border-b-2 border-gray-300">

    <!-- Movies tab button -->
    <button
      (click)="switchTab('movies')"
      [ngClass]="{
        'border-b-2 border-gray-900 text-gray-900': activeTab === 'movies',
        'text-gray-500 hover:text-gray-800': activeTab !== 'movies'
      }"
      class="px-6 py-3 font-semibold transition-all duration-300 text-sm md:text-base"
    >
      <span class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z" />
        </svg>
        <span>Movies</span>
        <span class="bg-gray-800 text-white text-xs rounded-full px-2 py-1">
          {{ movies.length }}
        </span>
      </span>
    </button>

    <!-- TV Shows tab button -->
    <button
      (click)="switchTab('shows')"
      [ngClass]="{
        'border-b-2 border-gray-900 text-gray-900': activeTab === 'shows',
        'text-gray-500 hover:text-gray-800': activeTab !== 'shows'
      }"
      class="px-6 py-3 font-semibold transition-all duration-300 text-sm md:text-base"
    >
      <span class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
        </svg>
        <span>TV Shows</span>
        <span class="bg-gray-800 text-white text-xs rounded-full px-2 py-1">
          {{ shows.length }}
        </span>
      </span>
    </button>

  </div>
</div>

<!-- ───────────── MOVIES TAB ───────────── -->
<div *ngIf="activeTab === 'movies'">

  <!-- Skeleton loader -->
  <div
    *ngIf="isLoadingMovies"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    <div *ngFor="let _ of [1,2,3,4,5,6,7,8]" class="animate-pulse">
      <div class="bg-gray-300 rounded-xl h-80 mb-4"></div>
      <div class="bg-gray-300 rounded h-4 mb-2"></div>
      <div class="bg-gray-300 rounded h-4 w-3/4"></div>
    </div>
  </div>

  <!-- Loaded content -->
  <div *ngIf="!isLoadingMovies">

    <!-- Empty state -->
    <div *ngIf="movies.length === 0" class="text-center py-12 text-gray-500 text-lg">
      <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
        <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z" />
      </svg>
      <p>No movies to display.</p>
    </div>

    <!-- Movies grid -->
    <div
      *ngIf="movies.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    >
    <app-movie-card
        *ngFor="let movie of movies"
        [movie]="movie"
        (isSelected)="onSelectMovie(movie)"
      >

      </app-movie-card>
    </div>

  </div>
</div>

<!-- ───────────── TV SHOWS TAB ───────────── -->
<div *ngIf="activeTab === 'shows'">

  <!-- Skeleton loader -->
  <div
    *ngIf="isLoadingShows"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    <div *ngFor="let _ of [1,2,3,4,5,6,7,8]" class="animate-pulse">
      <div class="bg-gray-300 rounded-xl h-80 mb-4"></div>
      <div class="bg-gray-300 rounded h-4 mb-2"></div>
      <div class="bg-gray-300 rounded h-4 w-3/4"></div>
    </div>
  </div>

  <!-- Loaded content -->
  <div *ngIf="!isLoadingShows">

    <!-- Empty state -->
    <div *ngIf="shows.length === 0" class="text-center py-12 text-gray-500 text-lg">
      <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
      </svg>
      <p>No TV shows to display.</p>
    </div>

    <!-- TV Shows grid -->
    <div
      *ngIf="shows.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    >
      <app-tvshow-card
        *ngFor="let show of shows"
        [tvshow]="show"
        (isSelected)="onSelectShow(show)"
      >

      </app-tvshow-card>
    </div>

  </div>
</div>
