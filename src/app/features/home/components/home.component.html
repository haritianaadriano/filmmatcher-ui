<div class="min-h-screen flex flex-col">
  <!-- Navbar -->
  <app-navbar class="relative z-20"></app-navbar>

  <!-- Hero Section -->
  <section
    class="relative flex items-center px-2 sm:px-8 md:px-14 lg:px-32 xl:px-[150px] py-16 flex-grow min-h-[400px] overflow-hidden bg-gray-900"
  >
    <!-- Texte à gauche avec boules animées -->
    <div
      class="relative max-w-xl text-left text-white z-10 translate-x-5 sm:-translate-x-4 md:-translate-x-10 lg:-translate-x-20 xl:-translate-x-22"
    >
      <!-- Background balls with custom neon colors -->
      <div
        class="absolute -top-20 -left-20 w-72 h-72 rounded-full blur-3xl"
        style="background-color: #00e5ff; opacity: 0.4"
      ></div>
      <div
        class="absolute top-10 -right-32 w-80 h-80 rounded-full blur-3xl"
        style="background-color: #ff007a; opacity: 0.4"
      ></div>
      <div
        class="absolute bottom-0 left-1/2 w-96 h-96 rounded-full blur-3xl"
        style="background-color: #ffd600; opacity: 0.3"
      ></div>

      <h1 class="text-5xl md:text-8xl font-bold font-anton mb-4 mr-6 md:pt-10">
        Live your own Life with REAL
      </h1>
      <p
        class="mb-6 font-mistrully text-3xl md:text-8xl transition-opacity duration-500"
        [class.fade]="fade"
        [style.color]="getColor(currentPhrase)"
      >
        {{ currentPhrase }}
      </p>

      <button
        class="bg-blue-600 px-6 py-3 hover:bg-blue-700 rounded-full transition"
      >
        More features
      </button>
    </div>

    <!-- Grille animée à droite -->
    <div class="flex-1 relative h-[500px] ml-8 opacity-80">
      <div class="grid grid-cols-6 gap-4 animate-scroll-up h-full">
        <div
          *ngFor="let card of cards; let i = index"
          class="w-52 h-80 rounded-xl overflow-hidden shadow-lg transform rotate-3 hover:scale-105 transition-transform duration-300"
          [ngClass]="{
            'mt-0 -translate-x-2': i % 3 === 0,
            'mt-8 -translate-x-4': i % 3 === 1,
            'mt-16 -translate-x-6': i % 3 === 2,
          }"
        >
          <img [src]="card" alt="movie" class="w-full h-full object-cover" />
        </div>
      </div>
    </div>
  </section>
</div>
