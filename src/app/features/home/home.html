<div class="min-h-screen flex flex-col">
  <!-- Navbar -->
  <app-navbar class="relative z-20"></app-navbar>

  <!-- Hero Section -->
  <section
    class="relative flex items-center px-4 sm:px-8 md:px-16 lg:px-32 xl:px-[150px] py-16 flex-grow min-h-[400px]"
    style="
      background-image: url(&quot;https://m.media-amazon.com/images/M/MV5BYTQyNTRmYjItMDBjYi00YWNhLWEwMmQtNzJhODNiNjEzOWJlXkEyXkFqcGc@._V1_.jpg&quot;);
      background-size: cover;
      background-position: right center;
    "
  >
    <div
      class="absolute inset-0 bg-gradient-to-r from-black/100 to-transparent"
    ></div>

    <!-- Texte à gauche -->
    <div class="relative max-w-xl text-left text-white z-10">
      <h1 class="text-5xl md:text-6xl font-bold font-anton mb-4 mr-6">
        Live your REAL
      </h1>
      <p
        class="mb-6 font-mistrully text-3xl md:text-5xl transition-opacity duration-500"
        [class.fade]="fade"
        [style.color]="getColor(currentPhrase)"
      >
        {{ currentPhrase }}
      </p>

      <button
        class="bg-blue-600 px-6 py-3 rounded-lg hover:bg-blue-700 transition"
      >
        Search your crush
      </button>
    </div>

    <div class="flex-1"></div>
  </section>
</div>
