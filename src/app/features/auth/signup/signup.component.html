<div
  class="w-full h-screen flex flex-col md:flex-row items-center justify-center bg-gray-200"
>
  <!-- Flèche back -->
  <div class="mb-4 md:mb-0 md:mr-4">
    <a href="/" class="inline-block">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-9 bg-white text-black rounded-lg cursor-pointer"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
        />
      </svg>
    </a>
  </div>

  <!-- Stepper Container -->
  <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">
      <span class="font-anton font-black">Instant</span>
      <span class="font-mistrully font-black ml-2">Crush</span>
      <span>
        <p class="text-sm font-light text-gray-500">Says you welcome !</p>
      </span>
      <hr />
    </h2>

    <!-- STEP 1 : Register -->
    <form *ngIf="currentStep === 1" [formGroup]="accountForm">
      <label class="block mb-2 font-medium text-gray-700">Name</label>
      <input
        type="text"
        formControlName="firstname"
        class="w-full mb-4 px-4 py-2 border border-gray-300 placeholder-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-black"
        placeholder="Your First Name"
      />
      <input
        type="text"
        formControlName="lastname"
        class="w-full mb-4 px-4 py-2 border border-gray-300 placeholder-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-black"
        placeholder="Your Last Name"
      />

      <label class="block mb-2 font-medium text-gray-700">Email</label>
      <input
        type="email"
        formControlName="email"
        class="w-full mb-4 px-4 py-2 border border-gray-300 rounded placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black"
        placeholder="your.email@example.com"
      />

      <label class="block mb-2 font-medium text-gray-700">Password</label>
      <input
        type="password"
        formControlName="password"
        class="w-full mb-6 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black placeholder-gray-400"
        placeholder="••••••••"
      />

      <button
        type="button"
        class="w-full bg-black text-white py-2 rounded hover:bg-gray-700 transition"
        (click)="nextStep()"
        [disabled]="!accountForm.valid"
      >
        Next
      </button>
    </form>

    <!-- STEP 2 : Preferences -->
    <form *ngIf="currentStep === 2" [formGroup]="preferencesForm">
      <label class="block mb-2 font-medium text-gray-700"
        >Favorite Movies Genres (optional)</label
      >
      <select
        formControlName="liked_genres"
        multiple
        class="w-full mb-6 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-black placeholder-gray-400"
      >
        <option *ngFor="let g of genres" [value]="g">{{ g }}</option>
      </select>
      <small class="text-gray-500">(Hold Ctrl / Cmd to select multiple)</small>

      <div class="flex justify-between mt-6">
        <button
          type="button"
          class="bg-gray-300 text-black px-4 py-2 rounded hover:bg-gray-400 transition"
          (click)="prevStep()"
        >
          Back
        </button>
        <button
          type="button"
          class="bg-black text-white px-4 py-2 rounded hover:bg-gray-700 transition"
          (click)="finish()"
        >
          Finish
        </button>
      </div>
    </form>
  </div>
</div>
