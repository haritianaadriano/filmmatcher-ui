<div
  class="w-full h-screen flex flex-col md:flex-row items-center justify-center bg-gray-200"
>
  <!-- Flèche back -->
  <div class="mb-4 md:mb-0 md:mr-4">
    <a href="/" class="inline-block">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-9 bg-white text-black rounded-lg cursor-pointer"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
        />
      </svg>
    </a>
  </div>

  <!-- Formulaire Register -->
  <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">
      <span class="font-anton font-black">Instant</span>
      <span class="font-mistrully font-black ml-2">Crush</span>
      <span
        ><p class="text-sm font-light text-gray-500">
          Says to you welcome !
        </p></span
      >
      <hr />
    </h2>
    <form>
      <label for="name" class="block mb-2 font-medium text-gray-700"
        >Name</label
      >
      <input
        type="text"
        id="name"
        name="name"
        required
        class="w-full mb-4 px-4 py-2 border border-gray-300 placeholder-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Your Name"
      />

      <label for="email" class="block mb-2 font-medium text-gray-700"
        >Email</label
      >
      <input
        type="email"
        id="email"
        name="email"
        required
        class="w-full mb-4 px-4 py-2 border border-gray-300 placeholder-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="your.email@example.com"
      />

      <label for="password" class="block mb-2 font-medium text-gray-700"
        >Password</label
      >
      <input
        type="password"
        id="password"
        name="password"
        required
        class="w-full mb-4 px-4 py-2 border border-gray-300 placeholder-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="••••••••"
      />

      <label for="confirmPassword" class="block mb-2 font-medium text-gray-700"
        >Confirm Password</label
      >
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        required
        class="w-full mb-6 px-4 py-2 border border-gray-300 placeholder-gray-400 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="••••••••"
      />

      <button
        type="submit"
        class="w-full bg-black text-white py-2 rounded hover:bg-blue-700 transition"
      >
        <span class="font-anton">Register</span>
      </button>
    </form>
  </div>
</div>
