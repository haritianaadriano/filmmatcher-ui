<div class="min-h-screen bg-gradient-to-br bg-gray-100 px-4 py-8 ml-12">
  <app-dashboard-nav></app-dashboard-nav>
  <!-- Header section -->
  <!-- Header section -->
  <div class="max-w-7xl mx-auto mb-8">
    <div class="bg-white rounded-xl shadow-md p-6 mb-6 border border-gray-200">
      <div
        class="flex flex-col md:flex-row md:items-start md:justify-between gap-4"
      >
        <!-- Titre et description principale -->
        <div class="flex-1">
          <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-3">
            {{ name || "Collection Details" }}
          </h1>

          <!-- Genre Badge -->
          <div *ngIf="genre" class="inline-block mb-4">
            <span
              class="bg-gray-800 text-white text-sm font-semibold px-3 py-1 rounded-full"
            >
              {{ genre }}
            </span>
          </div>

          <!-- Description -->
          <div *ngIf="description">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">
              Description
            </h3>
            <p class="text-gray-600 text-base leading-relaxed">
              {{ description }}
            </p>
          </div>

          <div *ngIf="!description" class="text-gray-500 italic">
            No description available
          </div>
        </div>
      </div>
    </div>

    <!-- Instructions sous le header -->
    <p class="text-gray-600 text-lg">
      Browse movies and TV shows in your collection
    </p>
  </div>
  <app-media-list
    [movies]="movies"
    [shows]="tvshows"
    [isLoadingMovies]="isLoadingMovies"
    [isLoadingShows]="isLoadingShows"
    (movieSelected)="onSelectMovie($event)"
    (showSelected)="onSelectTvShow($event)"
  ></app-media-list>
</div>
