<div
  class="relative flex flex-col lg:flex-row min-h-screen bg-gray-100 p-6 justify-center items-start"
>
  <app-dashboard-nav></app-dashboard-nav>

  <!-- Main content -->
  <div
    class="flex-1 bg-white shadow-lg rounded-lg p-6 m-4 lg:ml-18 flex flex-col"
  >
    <div>
      <h2 class="text-2xl font-bold mb-4">Collections</h2>
      <p class="text-gray-700">Easily manage your personal collections.</p>
    </div>

    <!-- Bottom section -->
    <div class="mt-6 w-full flex-1 flex flex-col">
      <!-- Header row -->
      <div class="flex justify-between items-center pb-2">
        <h3 class="text-lg font-semibold">
          Your <span class="font-mistrully text-2xl">Collections</span> :
        </h3>

        <!-- Open modal -->
        <button
          (click)="openCreateModal()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded-full shadow flex items-center justify-center"
          aria-label="Create a new collection"
        >
          +
        </button>
      </div>
      <hr class="border-t-2 border-gray-200 mb-4" />

      <!-- Scrollable grid for collections -->
      <div
        class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 overflow-y-auto pr-2"
        style="max-height: 60vh"
      >
        <!-- Card -->
        <!-- Collection Card -->
        <button
          *ngFor="let c of collections"
          (click)="onSelectCollection(c)"
          class="relative group rounded-xl overflow-hidden shadow-lg h-40 flex items-center justify-center bg-gradient-to-br from-neutral-900 via-neutral-800 to-black hover:scale-[1.02] transition-transform duration-300 border-0 cursor-pointer"
        >
          <!-- Overlay -->
          <div
            class="absolute inset-0 bg-black/40 group-hover:bg-black/30 transition"
          ></div>

          <!-- Content -->
          <div
            class="relative z-10 flex flex-col items-center leading-none text-center"
          >
            <!-- Title -->
            <span
              class="font-anton font-semibold text-3xl sm:text-4xl text-white"
            >
              {{ c.name }}
            </span>

            <!-- Genre -->
            <span
              class="font-mistrully font-semibold text-2xl sm:text-4xl transition-colors"
              [ngClass]="getGenreClass(c.genre!)"
            >
              {{ c.genre | lowercase }}
            </span>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Create Collection Modal -->
<div
  *ngIf="showCreateModal"
  class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
>
  <div
    class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative"
    tabindex="-1"
    (keydown.escape)="closeCreateModal()"
  >
    <button
      (click)="closeCreateModal()"
      class="absolute top-2 right-2 text-gray-500 hover:text-black"
      aria-label="Close modal"
    >
      ✕
    </button>

    <h2 class="text-xl font-bold mb-4">Create a New Collection</h2>

    <form
      [formGroup]="createForm"
      (ngSubmit)="submitCreate()"
      class="space-y-4"
    >
      <div>
        <label class="block text-sm font-medium text-black"
          >Title<span class="text-red-500">*</span></label
        >
        <input
          type="text"
          formControlName="name"
          placeholder="e.g. Action Movies"
          class="w-full mt-1 p-2 border rounded-lg placeholder-gray-300"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-black">Description</label>
        <input
          type="text"
          formControlName="description"
          placeholder="optional, auto-generated from title"
          class="w-full mt-1 p-2 border rounded-lg placeholder-gray-300"
        />
      </div>

      <div>
        <div>
          <label class="block text-sm font-medium text-gray-700"> Genre </label>
          <select
            formControlName="genre"
            class="w-full mt-1 p-2 border rounded-lg"
          >
            <option value="" disabled selected>-- Select a genre --</option>
            <option *ngFor="let g of genres" [value]="g">
              {{ g }}
            </option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button
          type="button"
          (click)="closeCreateModal()"
          class="px-4 py-2 rounded-lg border"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="createForm.invalid"
          class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white"
        >
          Create
        </button>
      </div>
    </form>
  </div>
</div>
